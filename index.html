<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>웅천고 전·출입 판정 도우미</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root{--ink:#111827;--mut:#4b5563;--line:#cbd5e1;--bg:#f3f5f9;--nav:#0b2a5b;--ok:#0f7a36;--okb:#dcf3e3;--bad:#b4121b;--badb:#ffe0e0;--rv:#8a5a00;--rvb:#fff1c7;--inf:#1d4ed8;--infb:#e1ecff;--na:#374151;--nab:#f1f2f4}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
header.top{background:var(--nav);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
header.top h1{margin:0;font-size:20px}
header.top small{opacity:.85}
nav.tabs{display:flex;gap:6px;padding:10px 20px 0;background:#e4e8f0;border-bottom:3px solid var(--nav);flex-wrap:wrap}
.tab{border:2px solid #94a3b8;border-bottom:none;background:#fff;color:#1f2937;padding:10px 18px;font-size:15px;font-weight:700;border-radius:8px 8px 0 0;cursor:pointer}
.tab.on{background:var(--nav);border-color:var(--nav);color:#fff;box-shadow:0 -3px 0 #f59e0b inset}
.tab:not(.on):hover{background:#f1f5f9}
.spacer{flex:1}
.btn{border:2px solid var(--nav);background:var(--nav);color:#fff;font-weight:700;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13px}
.btn.ghost{background:#fff;color:var(--nav)}
.btn.hwp{background:#1565c0;border-color:#1565c0}.btn.xls{background:#15803d;border-color:#15803d}
.pane{padding:16px 20px}
.grid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
form.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
form.panel h3{margin:0 0 8px;font-size:15px}
.fld{display:block;margin:0 0 8px}
.fld span{display:block;font-size:12px;color:var(--mut);margin-bottom:2px;font-weight:600}
.fld input,.fld select{width:100%;padding:7px 8px;border:1px solid #9aa6b8;border-radius:6px;font-size:14px;background:#fff;color:var(--ink)}
.fld input:focus,.fld select:focus{outline:2px solid #f59e0b;border-color:var(--nav)}
.fld.inline{max-width:420px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.toolbar .muted{margin-left:auto}
.sheet{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;max-width:1000px}
.sh-head h2{margin:0;font-size:19px;text-align:center}
.sh-meta{text-align:center;color:var(--mut);font-size:11.5px;margin:3px 0 8px}
table{border-collapse:collapse;width:100%}
.kv th,.kv td,.ck th,.ck td,.ct th,.ct td,.dt th,.dt td{border:1px solid #94a3b8;padding:4px 6px;vertical-align:top;font-size:12.5px;text-align:left}
.kv th,.ck th,.ct th,.dt th{background:#e8ecf3;font-weight:700;white-space:nowrap}
.kv th{width:12%}
.verdict{margin:10px 0 8px;padding:10px 14px;border-radius:8px;border:3px solid;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.verdict b{font-size:22px}
.verdict.ok{border-color:var(--ok);background:var(--okb);color:var(--ok)}
.verdict.bad{border-color:var(--bad);background:var(--badb);color:var(--bad)}
.verdict.review{border-color:#b7791f;background:var(--rvb);color:var(--rv)}
.badbox,.pendbox{border-left:6px solid var(--bad);background:#fff5f5;padding:6px 10px;margin:0 0 8px;font-size:13px}
.pendbox{border-color:#b7791f;background:#fffbeb}
.badbox ol,.pendbox ol{margin:4px 0 0;padding-left:20px}
.cite{color:var(--ink);font-size:12.5px}
td.st{font-weight:800;text-align:center;white-space:nowrap}
td.st.ok{background:var(--okb);color:var(--ok)}td.st.bad{background:var(--badb);color:var(--bad)}td.st.review,td.st.check{background:var(--rvb);color:var(--rv)}td.st.info,td.st.step{background:var(--infb);color:var(--inf)}td.st.na{background:var(--nab);color:var(--na)}
tr.r-na td{color:var(--ink)}
.rc{border:1px solid #64748b;background:#f8fafc;border-radius:4px;font-size:11px;padding:1px 4px;margin:1px 0;cursor:pointer;color:#0b2a5b;font-weight:700}
.rc:hover{background:#fde68a}
.cand{margin:10px 0}
td.seat.ok,.seat.ok{color:#0f7a36;font-weight:800}td.seat.ok{background:var(--okb)}td.seat.review,.seat.review{color:#8a5a00;font-weight:700}td.seat.review{background:var(--rvb)}td.seat.na,.seat.na{color:#6b7280}
.cand-h,.gne-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.gne-stamp{font-size:12px;color:var(--mut)}.gne-stamp.ok{color:#0f7a36;font-weight:700}.gne-stamp.warn{color:#b4121b;font-weight:700}.gne-stamp.busy{color:#8a5a00;font-weight:700}
.addrbox{display:flex;gap:6px}.addrbox input{flex:1}
.geo-msg{font-size:12px;margin-top:3px}.geo-msg.ok-msg{color:#0f7a36;font-weight:700}.geo-msg.warn-msg{color:#b4121b;font-weight:700}
.geo-cands{list-style:none;margin:4px 0;padding:0;display:flex;flex-direction:column;gap:3px}
.geo-cands button{width:100%;text-align:left;border:1px solid #94a3b8;background:#fff;border-radius:5px;padding:3px 6px;font-size:12px;cursor:pointer}
.geo-cands button.on{border-color:#0b2a5b;background:#dbeafe;font-weight:700}
.geomap{height:230px;border:2px solid #0b2a5b;border-radius:8px;margin-top:6px}
.sch-tip{font-size:11px;font-weight:700;padding:1px 4px}
.rulesec{margin-top:14px;border-top:3px solid var(--nav);padding-top:8px}
.rs-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.rs-head b{font-size:15px}.rs-sub{color:var(--ink);font-size:12.5px}
.rs-btns{margin-left:auto;display:flex;gap:6px;align-items:center}
.btn.sm{padding:4px 9px;font-size:12px}
.rs-print{font-size:12px;font-weight:700;display:flex;gap:4px;align-items:center}
.rs-pickbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 8px;padding:6px 8px;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px}
.rs-cnt{font-size:13px;margin-right:4px}.rs-cnt b{font-size:15px;color:#0b2a5b}
.rd-row{display:flex;gap:6px;align-items:flex-start;margin:0 0 6px}.rd-row details{flex:1;margin:0}
.rd-pick{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;width:44px;padding:5px 2px;border:2px solid #0b2a5b;border-radius:6px;background:#fff;cursor:pointer;font-size:11px;font-weight:800;color:#0b2a5b}
.rd-pick input{width:18px;height:18px;margin:0;accent-color:#0b2a5b}
.rd-row:not(.unpicked) .rd-pick{background:#dbeafe}
.rd-row.unpicked .rd-pick{background:#fff}
details.rd{border:1px solid #94a3b8;border-left-width:6px;border-radius:6px;margin:0 0 6px;background:#fff}
details.rd.w-bad{border-left-color:var(--bad)}details.rd.w-review{border-left-color:#b7791f}details.rd.w-ok{border-left-color:var(--ok)}details.rd.w-info,details.rd.w-na{border-left-color:#64748b}
details.rd summary{cursor:pointer;padding:6px 8px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:13px;list-style-position:inside}
details.rd[open] summary{background:#f1f5f9;border-bottom:1px solid #cbd5e1}
details.rd .tag{font-size:11px;font-weight:800;padding:1px 6px;border-radius:4px}
.tag.bad{background:var(--badb);color:var(--bad)}.tag.review{background:var(--rvb);color:var(--rv)}.tag.ok{background:var(--okb);color:var(--ok)}.tag.info,.tag.na{background:var(--infb);color:var(--inf)}
.rel{font-size:12.5px;color:var(--ink);width:100%}
.rel i{font-style:normal;font-weight:700;margin-left:3px;padding:0 3px;border-radius:3px}
.rel i.s-bad{color:var(--bad);background:var(--badb)}.rel i.s-review,.rel i.s-check{color:var(--rv);background:var(--rvb)}.rel i.s-ok{color:var(--ok);background:var(--okb)}.rel i.s-step,.rel i.s-info{color:var(--inf);background:var(--infb)}.rel i.s-na{color:var(--na)}
.rd-body{padding:6px 10px 8px}
.rulesec .muted,.rulesec .rel i.s-na{color:var(--ink)}
.rel i.s-na{background:#e5e7eb}
.rd-why{font-size:12.5px;background:#fffbeb;border-left:3px solid #b7791f;padding:3px 7px;margin-bottom:4px}
.rd-body pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.55;margin:6px 0 0}
details.rd.flash{outline:3px solid #f59e0b}
.golink{border:1px solid #b4121b;background:#fff;color:#b4121b;font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;cursor:pointer;margin-left:4px}
.exb{display:flex;gap:6px;align-items:flex-start;margin-top:5px;padding:4px 6px;border:2px dashed #2563eb;border-radius:6px;background:#eff6ff;color:#1e3a8a;font-weight:700;font-size:12px;cursor:pointer}
.exb input{width:17px;height:17px;margin:0;flex:none;accent-color:#1d4ed8}
.exb.on{border-style:solid;background:#dbeafe}
tr.exd td.st{background:#c7f0d4;color:#065f2c;outline:2px solid #15803d;outline-offset:-2px}
.exbox{border-left:6px solid #1d4ed8;background:#eff6ff;padding:6px 10px;margin:0 0 8px;font-size:13px}
.exbox ol{margin:4px 0 0;padding-left:20px}
.ct tr.x td{color:#9ca3af;text-decoration:line-through}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;font-size:12.5px}
.two ul,.two ol{margin:4px 0;padding-left:18px}
.sh-foot{margin-top:10px;font-size:11px;color:var(--mut);border-top:1px dashed var(--line);padding-top:6px}
.muted{color:var(--mut);font-size:12px}
.note{background:#eef4ff;border:1px solid #c7d7fe;padding:8px 10px;border-radius:6px}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sub{border:2px solid #94a3b8;background:#fff;padding:6px 12px;border-radius:999px;font-weight:700;cursor:pointer}
.sub.on{background:#f59e0b;border-color:#b45309;color:#111}
.dt td.c{text-align:center}.dt td.best{font-weight:800;background:#dcf3e3}.dt td.me{outline:2px solid var(--nav)}
.dt tr.sum td{font-weight:700;background:#f8fafc}
.dt.edit input{width:80px;padding:3px 5px;border:1px solid #9aa6b8;border-radius:4px}
.scroll{overflow:auto;max-width:100%;margin-bottom:10px}.scroll.tall{max-height:70vh}
.row3{display:grid;grid-template-columns:repeat(3,minmax(160px,240px));gap:10px}
.rule{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.rule pre,dialog pre{white-space:pre-wrap;font-family:inherit;margin:6px 0 0;font-size:13px}
ol.warn li{margin-bottom:6px}
dialog{max-width:760px;width:92vw;border:3px solid var(--nav);border-radius:10px;padding:14px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.datab{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
@media print{
  @page{size:A4;margin:9mm}
  body{background:#fff;font-size:10px}
  header.top,nav.tabs,form.panel,.toolbar,#tab-data,dialog{display:none!important}
  body[data-tab="in"] #tab-out,body[data-tab="out"] #tab-in{display:none!important}
  body[data-tab="data"] .pane{display:none!important}
  .pane{padding:0}.grid{display:block}
  .sheet{border:none;padding:0;max-width:none}
  .kv th,.kv td,.ck th,.ck td,.ct th,.ct td{font-size:9px;padding:2px 4px}
  .verdict{padding:5px 10px;margin:5px 0}.verdict b{font-size:16px}
  .badbox,.pendbox,.two{font-size:9.5px}
  .rc{border:none;background:none;padding:0;font-size:8.5px}
  .exb{display:none!important}
  .golink,.rs-btns .btn,.rs-print,[data-act=gne-refresh]{display:none!important}
  .rd-row.unpicked,.rulesec.nopick,.rd-pick,.rs-pickbar{display:none!important}
  .rd-row details{opacity:1!important}
  details.rd{break-inside:auto}.rd-body pre{font-size:9.5px}details.rd summary{font-size:10px}
  .exbox{font-size:9.5px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body data-tab="in">
<header class="top"><h1>웅천고 전·출입 판정 도우미</h1><small>2026학년도 경남 전·편입학 업무 시행 지침 · 웅천고 규정집(2026.7.20.) 기준 · 기초자료 수집 2026-11-18</small></header>

</section>

</main>

/* ===== 기초자료 (2026-11-18 수집) ===== */

  J23: { t: '지침 Ⅱ-3. 전·편입학 및 재입학 허용 범위', p: '지침 3쪽', x: '일반 전·편입학 및 재입학 학생의 학교별 정원 외 총합 비율은 학년별(특성화고는 모집단위별) 입학 정원의 10%를 넘지 않도록 한다.\n- 유급생 및 재입학자: 제한 없음\n- 일반 전입생(타 시·도 중학교 졸업자 포함): 정원 외 5% 범위 내\n- 「혁신도시 조성 및 발전에 관한 특별법」에 의거 이전한 기관의 직원 자녀: 정원 외 5% 범위 내\n- 교육환경 전환 학생: 정원 외 3% 범위 내\n- 학교폭력 가해학생, 교육활동 침해학생: 제한 없음\n- 귀국학생 등: 정원 외 3% 범위 내\n- 국가유공자 자녀: 정원 외 3% 범위 내\n- 군인자녀: 정원 외 3% 범위 내\n- 고등학교 학년결정 입학자: 정원 외 2% 범위 내\n- 체육특기자: 제한 없음\n※ 단, 정원 외에는 결원이 없으나 정원 내 결원이 있는 경우 학교 내 전·편입학심의위원회에서 전입학 허가를 결정\n※ 특수교육대상자는 정원 외 총합 비율에 포함하지 않음' },
  J24ga: { t: '지침 Ⅱ-4-가. 전·편입학 허용 시기', p: '지침 3쪽', x: '교육과정 이수에 지장이 없는 범위 안에서 동일 계열 고등학교 간의 전·편입학을 원칙으로 함.\n- 동일 계열 고등학교 간: 전입교의 3학년 2학기 시작 전까지\n- 타 계열 고등학교 간: 전입교의 2학년 1학기 시작 전(2월 말일)까지\n- 귀국학생 등의 재·편입학: 전 학년(특별한 사유가 없는 한 귀국 후 1개월 이내, 학업연속성)\n- 학년결정 입학자의 편입학: 2학년 1학기, 2학년 2학기, 3학년 1학기(신청은 학기 시작 전후 10일 이내, 결과 통보는 학기 시작 후 20일 이내)\n※ 단, 경남체육고 재학 체육특기자 포기 학생에 한하여 2학년 1학기 2차고사 전까지 타 계열 전입학 허용' },
  J24da1: { t: '지침 Ⅱ-4-다-1). 시기 제한 예외와 계열 구분', p: '지침 4쪽', x: '학교폭력 가해 또는 교육활동 침해 학생이 동일 계열의 학교로 전입학 시에는 시기 제한 없음.\n- 동일 계열(1그룹): 특정분야 인재양성 특성화고, 산업수요맞춤형 특수목적고(거제공업고, 한국나노마이스터고, 삼천포공업고), 일반고 직업계열 학과(창녕여고 보건간호과, 삼가고 조리과)\n- 동일 계열(2그룹): 1그룹을 제외한 모든 학교' },
  J24da2: { t: '지침 Ⅱ-4-다-2). 교육과정 이수에 지장이 없는 범위', p: '지침 4쪽', x: '가) 해당 학년 전·편·재입학 이전의 출석일수와 출석해야 할 일수를 합산하여 당해 학교 당해 학년 수업일수의 2/3 이상이어야 전·편입학 허가\n※ 3분의 2 미만이 될 경우 수료 또는 졸업 인정이 되지 않아 원칙적으로 당해 학년도 재입학·전입학·복학이 불가능함(「초·중등교육법 시행령」 제50조제2항)\n나) 이전의 교육과정 이수 학점(시간)과 이후 이수해야 할 학점(시간)을 합산하여 해당 학교 교육과정 총 이수 학점을 충족해야 함을 고려하여 허가\n다) 계열을 달리하는 전·편·재입학 허가 시 학교별 교육과정 차이를 신중히 고려하고, 진학 및 취업 제한 등의 불이익이 발생할 수 있음을 학생과 학부모에게 충분히 안내한 후 허가' },
  J31ga: { t: '지침 Ⅲ-1-가. 전입학 대상자(타 시·도)', p: '지침 5쪽', x: '타 시도 소재 고등학교에 재학 중인 자로서 전 가족의 거주지가 단독세대를 구성하여 경상남도로 이전된 자(동일 학군 내 거주지 이전으로 인한 고등학교 전입학은 불가함)\n※ "전 가족"은 부·모 및 전입학 대상 학생\n※ 주민등록상 전 가족이 단독세대(부 또는 모가 세대주인 거주지에 등재된 경우)를 구성하여 이전한 경우에 한하며, 동거인으로 등재된 경우 거주지 이전으로 인정하지 않음(위장전입의 경우 해당 학군 또는 지역으로 전입학 불가)\n※ 단, 부 또는 모가 불가피하게 함께 이전할 수 없는 경우, 추가 서류를 제출한 자는 전 가족의 거주지가 이전된 것으로 간주함(9쪽)' },
  J31na: { t: '지침 Ⅲ-1-나. 전입학 대상자(도내)', p: '지침 5쪽', x: '경상남도 고등학교에 재학 중인 자로서 전 가족의 거주지가 단독세대를 구성하여 타 학군으로 이전된 자\n※ 단, 특수목적고등학교, 전국단위 모집 고등학교, 비평준화지역 일반고등학교에 입학한 자의 경우 거주지 이전 없이 1학년 1학기 이후 전입학 신청 가능(12~13쪽)' },
  J31etc: { t: '지침 Ⅲ-1-다~차. 기타 전입학 대상자', p: '지침 5~6쪽', x: '다. 「혁신도시 조성 및 발전에 관한 특별법」 제28조에 의거 거주지가 경상남도로 이전된 자\n라. 「군인복지기본법」 제11조 및 같은 법 시행령 제8조에 따른 군인(군무원) 자녀(보호자가 소속(발령)된 군부대 주둔지역 학군의 학교로 전입학 가능)\n마. 교육환경 전환 대상자\n바. 학교폭력예방법 제17조제1항제8호에 따른 가해 학생으로 학교장이 교육감에게 배정 요청한 자\n사. 교원지위법 제25조제2항제6호에 따른 침해 학생으로 학교장이 교육감에게 배정 요청한 자\n아. 도내 체육특기자가 팀 해체, 운동이 불가능할 정도의 신체질환 등으로 자격을 상실하여 거주지 학군 소재 고등학교로 전입학을 희망하는 자\n자. 인구감소지역 지방자치단체가 설치·운영하는 센터 및 기숙사에 거주지를 두고 전입학을 요청한 자\n차. 진로변경 전입학제에 따라 전입학을 요청한 자(연 1회, 6월 중 공문, 8월 중 시행)' },
  J32: { t: '지침 Ⅲ-2. 교육환경 전환 전입학', p: '지침 6~7, 10~11쪽', x: '학교장이 교육상 교육환경을 바꾸어 줄 필요가 있다고 인정한 자에 대하여 부모의 동의를 얻어 전입학을 추천(생활지도 상의 문제로 인한 권고전학 또는 통학거리 사유 제외). 재적교 기피·특정학교 배정 목적으로 이용될 수 없음.\n대상: 1) 가정폭력·아동학대·성폭력 피해학생 2) 학교폭력 피해 학생(학교장자체해결 사항은 전입학 불가) 3) 희귀질환·암·1형 당뇨 등 중증 질병으로 현 재적교 등·하교가 어려운 자 4) 학교생활 부적응이 심각한 학생(학기 초 단순 부적응·교우 갈등 제외, 입학일로부터 3개월 이후 신청) ※ 교직원 자녀로 부(모)와 같은 학교 재학 중인 희망자\n절차: 재적교 접수 → 도교육청 중등교육과 공문 → 전입학심의위원회 심의(전학 여부·배정학교 결정) → 학교간 처리' },
  J34: { t: '지침 Ⅲ-4. 제출서류', p: '지침 9~11쪽', x: '가. 일반 전입학\n[공통] 1. 고등학교 전입학 배정원서(평준화: 서식1-1·1-2) 또는 전입학 신청서(비평준화: 서식1-3) 2. 주민등록등본(행정정보 공동이용 시 미제출) 3. 개인정보 수집 및 이용 동의서(서식2)\n[추가: 부 또는 모가 불가피하게 함께 이전할 수 없는 경우] 사유에 따라 학생명의 가족관계증명서, 학생명의 기본증명서(상세), 친권자 전입학 동의서(서식6) 중 해당 서류와 아래 기타서류(사유별 대응은 지침 9쪽 표 확인)\n- 부 또는 모가 주소를 이전할 수 없는 공무원·직장인 또는 사업가: 이전하지 못하는 부 또는 모의 주민등록등본, 재직증명서 또는 사업자등록증\n- 부 또는 모가 행방불명: 경찰관서 신고확인서 또는 말소된 주민등록등본\n- 친권자인 부 또는 모가 신청 / 친권자가 아닌 이혼한 부 또는 모가 신청 / 공동친권: 친권자 전입학 동의서(서식6), 동의를 받지 못하는 경우 친권자 미확인 서약서(서식7)\n- 부모 별거·부모 사망: 가족관계증명서 등으로 확인\n- 전세금 보호를 위한 경우: 행정복지센터에서 확정일자를 받은 전세 계약서 사본\n- 분양(신축) 후 신규 입주 아파트(주택) 전입 예정자(6개월 이내): 전입 예정을 확인할 수 있는 서약서(서식8), 전입과 동시에 해당 학교에 주민등록등본 제출\n- 개인 신용불량 및 파산선고: 개인 파산선고된 자의 확인서(법원 발행)\n- 아동양육시설·가정위탁·보호시설 입소자: 입소증 또는 가정위탁보호확인서\n- 무연고 학생(친권자 연락두절·연락불가), 소년소녀가정: 소년소녀가장임을 증명할 수 있는 서류 또는 기초생활수급자증명서\n- 학생의 부모가 미혼부 또는 미혼모: 부 또는 모의 혼인관계증명서\n- 그 외 전 가족 단독세대 구성이 어려운 자: 가족관계증명서, 기본증명서(상세), 친권자 전입학 동의서, 사유서\n\n나. 교육환경 전환 대상자\n[공통] 1. 전입학 배정원서(교육환경 전환 대상자 등, 서식1-4) 2. 주민등록등본 3. 개인정보 동의서(서식2) 4. 학교장 의견서(서식4) 5. 담임 의견서(서식5)\n[추가] - 가정폭력·아동학대 피해자(택1): 가정폭력상담소·보호시설 발급 상담사실 확인서 / 지방자치단체의 취학지원 요청 공문과 학대피해아동 취학지원 요청서 / 학대피해아동담당 지방자치단체 또는 아동보호전문기관 확인서 (형제자매 등 가족 지원 시 가족관계증명서·등본으로 확인)\n- 성폭력 피해자(택1): 성폭력 상담소·보호시설·성폭력피해자통합지원센터(해바라기센터 등) 장이 발급한 상담사실 확인서 / 병·의원 발급 성폭력피해진단서\n- 학교폭력 피해자: 학교폭력대책심의위원회 조치 결정 통보서 사본(원본대조필), 학부모 사유서(서식3), 심의에 필요한 기타 자료 ※ 학교장자체해결로 해결된 사항은 전입학 불가\n- 희귀질환·암·1형 당뇨 등 중증 질병으로 등·하교가 어려운 자: 종합병원급 의사진단서(신청일 기준 3개월 이내, 「희귀(난치)병(1형 당뇨) 치료 중」 문구), 병원진료확인서, 학부모 사유서(서식3), 담임교사 상담기록 사본\n- 부적응으로 인한 위기 학생: <필수> 학부모 사유서(서식3), 담임교사 상담기록 사본(5회 이상), 상담교사 의견서 및 상담기록 사본(5회 이상) 또는 Wee센터 상담기록(5회 이상, 주 1회 인정)·외부 전문상담기관(3회 이상, 주 1회 인정) <선택> 의료기관 심리치료 증빙, 학업중단숙려제·학교위기관리위원회 회의록 등 노력 증빙\n- 교직원 자녀로 부(모)와 같은 학교 재학 중인 희망자: 학부모 사유서(서식3), 부 또는 모의 재직증명서\n\n다. 체육특기자 포기 학생\n1. 전입학 배정원서(서식1-4) 2. 주민등록등본 3. 개인정보 동의서(서식2) 4. 학교장 의견서(서식4) 5. 담임 의견서(서식5) 6. 학부모 사유서(서식3) 7. 체육특기자소위원회 회의록 사본(원본대조필) 8. 사유별: 팀 해체 - 해체 사유서 / 신체질환 - 종합병원급 진단서(최근 3개월 이내) / 기능 부족 - 감독교사 의견서(입학·전입학일로부터 3개월 이후 신청 가능)' },
  J35na: { t: '지침 Ⅲ-5-나. 평준화지역 배정 기준', p: '지침 12쪽', x: '접수순으로 전입학 허용 범위 내에서 희망하는 5개 학교 중 추첨 배정한다. (배정원서 접수: 도교육청 중등교육과 방문 또는 팩스, 결과는 학교 공문·보호자 문자. 배정일로부터 7일 이내 수속하지 않으면 배정 취소)' },
  J35da: { t: '지침 Ⅲ-5-다. 평준화지역 전입학 기본 방침', p: '지침 12~13쪽', x: '1) 평준화지역 일반고 재학 중 타 학군·타 지역으로 전입학하였다가 다시 전입학을 원할 때는 재학기간 3개월 이상일 때 신청(거주지 재이전도 동일)\n2) 경남 중학교 졸업 후 특수목적고 또는 전국단위 모집 고등학교에 진학하여 한 학기 이상 재학한 자는 일반고로 전입학 신청 가능(거주지 내 동일 계열 원칙, 타 계열은 진로변경 기준 충족)\n3) 다른 학교로 전입학하였다가 다시 동일 학군으로 전입하는 자는 전출 이전의 재적 학교로 배정 원칙\n4) 평준화지역 일반고 재학자는 동일 학군 내 타 일반고로 전입학할 수 없다\n5) 평준화지역 입학전형에 불합격·응시 포기하고 비평준화지역 일반고에 입학한 자는 재학기간 한 학기 이후에 전입학 신청 가능\n7) 학력인정 평생교육시설, 고등기술학교, 산업체부설고, 방송통신고, 공군항공과학고 재학생은 평준화지역 일반고 전입학 대상에서 제외(동일 형태 학교 간 허용)\n9) 학교폭력 가해학생은 민주시민교육과 심의에 따라 배정, 피해학생 재학학교와 거리 10km(대중교통 최적거리) 가급적 준수' },
  J35sa: { t: '지침 Ⅲ-5-사. 거주지 조사·위장전입', p: '지침 14~16쪽', x: '일반고 간 전학은 거주지 이전으로 통학여건이 불편해진 학생을 위한 제도로, 실제 거주지 이전 없이 재적교를 기피하거나 특정학교 배정 목적으로 이용될 수 없다. 전입교의 장은 공정한 거주지 조사를 할 수 있다(서식10 동의서, 서식11 보고서).\n6) 가) 위장전입 판명 시 교육감은 배정을 취소할 수 있음(위장전입 시 6개월간 전입학을 불허할 수 있음)\n나) 학교 전입일 기준 거주기간과 재학기간(방학 제외) 3개월 미만에 직전 학교군의 거주지로 이전하는 경우 원적교로 환원\n5) 거주 사실 판단 기준 - 실거주로 간주: 가. 부모가 이혼 후 재혼 등으로 어머니(친모)에게 동거인으로 등재된 경우 나. 부모의 사망 등으로 형·자매·친척에게 동거인으로 등재된 경우 다. 부 또는 모가 주소를 이전할 수 없는 생업종사자(공무원·군인·회사원 등)로 타 지방 또는 다른 학군에 실거주하는 경우 라. 기타 부모가 불가피하게 함께 이전할 수 없는 경우로서 증빙서류를 제출한 경우' },
  J42: { t: '지침 Ⅳ-2-가-3). 편입학 시기와 학습권 보호 단서', p: '지침 28쪽', x: '편입학은 해당 학교의 교육과정 이수에 지장이 없는 범위인 당해 학년 수업일수의 3분의 2 이상 남은 시점까지 수시로 입급할 수 있음\n※ 학생의 출석일수가 당해 학년 수업일수의 3분의 2 미만이 될 경우에는 수료 또는 졸업 인정이 되지 않으므로 원칙적으로 당해 학년도 입학·편입학 등은 불가능함\n※ 다만, 학생과 학부모가 원할 경우 당해 학교장은 학교의 교육 여건 등을 고려하여 학생의 학습권 보호 차원에서 허가할 수 있음. 이때 학교에서는 허가에 앞서 학생, 학부모에게 당해 학년도에는 출석일수 부족으로 수료 또는 졸업이 되지 않음을 정확히 주지 및 확인시켜 주어야 함\n(전입학에는 명시 규정이 없어 「원칙적으로」 불가의 예외로 준용 여부를 학교가 판단)' },
  J36na: { t: '지침 Ⅲ-6-나. 비평준화지역 고등학교 전입학 기본 방침', p: '지침 17쪽', x: '1) 총칙 및 평준화지역 일반고 배정 원칙에 준하여 교육과정 이수에 지장이 없는 범위 내에서 학교장이 정하는 학칙에 의하여 시행하고, 학칙을 홈페이지에 탑재\n2) 학교 내 전편입학심의위원회에서 허가 여부 결정(서류전형, 필기시험 등 어떠한 종류의 평가도 할 수 없으며, 학교생활기록부를 요구할 수 없음)\n3) 전 가족이 거주 이전한 후 구비 서류를 완비하여 신청하면 전입학 해당 법규에 위배되는 결격 사유가 없는 한 허가하여야 하며, 학생의 성적이나 전 재적교의 결석 등 생활지도 상의 문제를 이유로 불허할 수 없다(법령이나 지침에 의하지 않고 학교 자체적으로 정한 결격 사유에 의해 불허할 수 없음)\n4) 특성화고 재학생이 비평준화지역으로 이전하였으나 해당 학군에 특성화고가 없으면 인근 지역 특성화고에서 허가 가능\n5) 타 학교로 전학을 가고자 하는 학생에 대하여 소속 학교에서 이를 제한할 수 없다\n다. 학생 정원 및 현원 현황은 민원인 요구 시 열람' },
  J37: { t: '지침 Ⅲ-7. 진로변경 전입학제', p: '지침 19~23쪽', x: '경남 일반고·자공고 1학년 재학생 → 거주지 학군 특성화고, 특성화고·마이스터고 1학년 재학생 → 거주지 학군 일반고·자공고(진해는 거주지 학군에 특성화고가 없어 인근 창원·마산 특성화고로 신청 가능). 연 1회(8월 중).\n신청 제외: 미인정 결석 3일 이상 / 미인정 결석 2일 + 미인정 지각·조퇴·결과 합 4회 이상 / 결석 1일 + 합 7회 이상 / 지각·조퇴·결과 합 10회 이상 / 학교폭력 가해·교육활동 침해 사안 진행 중이거나 조치를 받은 학생 / 학교선도규정 \'사회봉사\' 이상 징계\n허용 인원: 특성화고→일반고는 기준일 현재 1학년 정원 내 결원 수, 일반고→특성화고는 1학년 정원 내 결원 수 + 정원 외 2% 이내\n특성화고→비평준화지역 일반고는 거주지 학군 1개 학교 신청(학교장 허가). 각종학교·고등기술학교 등은 적용 제외' },
  J5: { t: '지침 Ⅴ. 귀국학생 등의 입학 및 편입학', p: '지침 29~33쪽', x: '귀국학생 등: 외국에서 귀국한 학생, 재외국민 자녀, 북한이탈주민, 외국인 학생 등(「초·중등교육법 시행령」 제19조)\n신청 기한: 외국 정규교육기관 최종 재학일과 편입학 신청일 사이 공백이 1개월 이내(2/3 미달이어도 수료하려면 1개월 이내 신청, 그렇지 않으면 1개월 이후에도 신청 가능)\n인정유학: 외국 정규학교 이수기간 6개월(한 학기) 이상. 신청은 교육청이 아닌 주소지 관할 고등학교에 직접\n수료기준 출석일수: 입급일부터 학년 종료일까지 남은 수업일수의 3분의 2 이상' },
  J6: { t: '지침 Ⅵ. 학년결정 입학', p: '지침 37~40쪽', x: '해당 학년 정원의 2% 범위 내 정원 외 편입학. 원적교와 계열이 다르면 2학년 1학기까지, 동일 계열은 3학년 1학기까지. 원서 접수: 학기 시작 전 10일 ~ 시작 후 10일 이내. 신청 자격: 전 가족이 신청학교 관할 지역에 거주하며 학교 외 학습경험 기준 충족. 3학년 2학기 입학은 불가. 조기진급·졸업·진학 평가위원회의 심의와 교과목별 이수인정평가 후 학교장 결정' },
  W22: { t: '웅천고 학교규칙 제22조(전·편입학)', p: '규정집 4쪽', x: '① 본교에 전·편입학을 지원하는 자가 있을 때에는 결원이 있는 경우에 한하여 본교 교육과정을 이수하는데 지장이 없는 범위 안에서 학교의 장이 허가할 수 있다.\n② 본교의 전·편입학은 \'경상남도 고등학교 전·편입학 및 재입학 업무 시행지침\'에 따르며, 필요시 별도의 규정을 둘 수 있다.\n③ 1. 외국에서 부모 모두 함께 2년 이상 거주하고, 2년 이상 재학한 귀국자의 자녀에 대하여 학교장은 해당학년 정원의 5% 범위 내에서 정원 외로 특례 입학 및 전·편입학을 허가할 수 있다. 2. 특례입학대상자가 아닌 일반귀국자는 정원 범위 내에서 전·편입학을 허가할 수 있다.\n④ 가정폭력 및 성폭력피해자가 주소지 이외의 지역에서 취학할 필요가 있을 때 학교의 장이 허가할 수 있다.' },
  W23: { t: '웅천고 학교규칙 제23조(학년결정 입학)', p: '규정집 5쪽', x: '② 학년결정 입학은 해당 학년 정원의 2% 범위 내에서 정원 외로 편입학을 허용하며, 입학 허용 시기는 2학년 1학기, 2학년 2학기, 3학년 1학기로 한다.' },
  R2: { t: '웅천고 전·편입학 규정 제2·4조(위원회)', p: '규정집 142쪽', x: '제2조 ② 위원회는 교감(위원장), 교무기획부장, 교육과정부장, 해당 학년부장, 학적담당교사(간사)로 구성한다.\n제4조 ② 회의는 재적 위원 과반수의 출석과 출석 위원 5분의 3 이상 찬성으로 의결한다.' },
  R5: { t: '웅천고 전·편입학 규정 제5조(허용 범위)', p: '규정집 142쪽', x: '전·편입학 및 재입학 허용 범위는 경상남도 고등학교 전·편입학 업무 시행 지침에 따른다.' },
  R6: { t: '웅천고 전·편입학 규정 제6조(본교 전입 허용 범위)', p: '규정집 142쪽', x: '경상남도 고등학교 전·편입학 업무 시행 지침에 부합하고 다음 각 호의 충족 여부를 위원회에서 심의하여 전입학을 허용한다. 단, 다음에 명시되지 않은 사항은 위원회에서 정한다.\n① 교육과정 이수에 지장이 없는 학생\n② 거주지가 관내 다른 학교보다 거리상 본교에 현저히 가까운 학생\n③ 위원회 위원 만장일치로 전입에 동의하는 학생\n④ 본교 재학 중 타 학군 및 타 지역의 고등학교로 전학하였다가 다시 본교로 전학을 원하는 경우, 신청일 기준 거주 기간과 학생의 재학 기간이 각각 3개월(90일) 이상일 때 신청할 수 있음(거주지 재이전의 경우도 동일하게 적용)' },
  R7: { t: '웅천고 전·편입학 규정 제7조(미이수 과목)', p: '규정집 142쪽', x: '전·편입학으로 인해 교육과정 운영상의 미이수 과목이 발생할 경우 그로 인한 진학 또는 취업상의 불이익은 본인이 감수한다. (별지 확인서: 미이수 과목으로 인한 불이익에 대하여 충분한 설명과 안내를 받았으며 책임은 본인에게 있음을 확인)' }

/* ===== 판정 엔진 ===== */
var CUR_EX = {}; // 현재 판정에 적용할 예외 체크 {id:true}
var ST = {
  ok: { l: '충족', c: 'ok' }, bad: { l: '위배·불가', c: 'bad' }, review: { l: '심의·조건부', c: 'review' },
  check: { l: '확인 필요', c: 'check' }, na: { l: '해당 없음', c: 'na' }, info: { l: '안내', c: 'info' }, step: { l: '절차', c: 'step' }
};
function pd(s) { if (!s) return null; var a = s.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }
function fmt(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function addD(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function hav(a, b, c, d) { var R = 6371, r = Math.PI / 180, x = Math.sin((c - a) * r / 2), y = Math.sin((d - b) * r / 2); var h = x * x + Math.cos(a * r) * Math.cos(c * r) * y * y; return 2 * R * Math.asin(Math.sqrt(h)); }

function needDays(cal) { return Math.ceil(calTotal(cal) * 2 / 3); }
/* 학사일정의 수업일 목록(학기 기간 평일 - 휴업일) */
function schoolDays(cal) {
  var out = [], hol = {}; (cal.holidays || []).forEach(function (x) { hol[x] = 1; });
  (cal.periods || []).forEach(function (p) {
    for (var d = pd(p[0]), e = pd(p[1]); d <= e; d = addD(d, 1)) { var w = d.getDay(); if (w >= 1 && w <= 5 && !hol[fmt(d)]) out.push(fmt(d)); }
  });
  return out;
}
function calTotal(cal) { return schoolDays(cal).length; }
/* 기준 학사일정에서 date(포함) 이후 남은 수업일수. 범위 밖이면 null */
function remainingDays(cal, ds) {
  var d = pd(ds); if (!d) return null;
  if (d < pd(cal.start) || d > pd(cal.end)) return null;
  return schoolDays(cal).filter(function (x) { return x >= ds; }).length;
}
function weekTable(cal) {
  var days = schoolDays(cal), m = {};
  days.forEach(function (x) { var d = pd(x), mon = addD(d, 1 - (d.getDay() || 7)); var k = fmt(mon); m[k] = (m[k] || 0) + 1; });
  return Object.keys(m).sort().map(function (k) { return [k, m[k]]; });
}function schoolYearOf(ds) { var d = pd(ds); return d.getMonth() >= 2 ? d.getFullYear() : d.getFullYear() - 1; }
function semesterOf(cal, ds) {
  var d = pd(ds), y = schoolYearOf(ds);
  var s2 = y === cal.year ? pd(cal.sem2) : (y === cal.year + 1 ? pd(cal.nextSem2) : new Date(y, 7, 15));
  return d >= s2 ? 2 : 1;
}

function quotaCheck(Q, grade, catKey, opt) {
  opt = opt || {};
  var q = Q.g[grade], ent = +q.ent, inside = +q.inside, vacIn = ent - inside;
  var total10 = 0; OUT_CATS.forEach(function (c) { if (c.in10) total10 += +(q.out[c.k] || 0); });
  var cap10 = Math.floor(ent * 0.10);
  if (catKey === 'unlimited') return { st: 'ok', v: '정원 외 비율 제한 없음 유형', why: '지침 Ⅱ-3: 해당 유형은 정원 외 비율 제한 없음' };
  if (catKey === 'insideOnly') {
    return vacIn > 0 ? { st: 'ok', v: grade + '학년 정원 내 결원 ' + vacIn + '명', why: '정원 내 결원 범위에서 허가' }
      : { st: 'bad', v: grade + '학년 정원 내 결원 0명', why: '정원 내 결원이 없어 불가' };
  }
  var cat = OUT_CATS.filter(function (c) { return c.k === catKey; })[0];
  var pct = opt.pct || cat.pct, cap = Math.floor(ent * pct / 100), cur = +(q.out[catKey] || 0);
  var v = cat.n + ' ' + cur + '/' + cap + '명(' + pct + '%) · 정원 외 총합 ' + total10 + '/' + cap10 + '명(10%) · 정원 내 ' + inside + '/' + ent + '명';
  if (cur < cap && total10 < cap10) return { st: 'ok', v: v, why: '정원 외 결원 있음(유형 ' + (cap - cur) + '명, 총합 ' + (cap10 - total10) + '명 남음)' };
  if (vacIn > 0) return { st: 'review', v: v, why: '정원 외 결원 없음 → 정원 내 결원 ' + vacIn + '명: 전·편입학심의위원회에서 허가 결정' };
  return { st: 'bad', v: v, why: (cur >= cap ? '해당 유형 정원 외 ' + pct + '% 소진' : '정원 외 총합 10% 소진') + ', 정원 내 결원도 없음' };
}

function distRank(dongName, gender, ds, manual, geo) {
  var dg = geo ? [geo.label, geo.lat, geo.lng] : DONGS.filter(function (d) { return d[0] === dongName; })[0];
  if (!dg && !(manual && manual.me)) return null;
  var d = pd(ds) || new Date();
  var list = JINHAE.filter(function (s) {
    if (s.from && d < pd(s.from)) return false;
    if (gender === '남' && s.g === '여') return false;
    if (gender === '여' && s.g === '남') return false;
    return true;
  }).map(function (s) {
    var st = dg ? hav(dg[1], dg[2], s.lat, s.lng) : 99, rd = geo && geo.road && geo.road[s.n] ? geo.road[s.n].km : null;
    return { s: s, km: rd != null ? rd : st, straight: st, road: rd };
  });
  if (manual && manual.me) {
    list.forEach(function (x) { if (x.s.me) x.km = +manual.me; });
    if (manual.other) {
      var others = list.filter(function (x) { return !x.s.me; }).sort(function (a, b) { return a.km - b.km; });
      if (others[0]) { others[0].km = +manual.other; others[0].manual = true; }
      others.slice(1).forEach(function (x) { if (x.km < +manual.other) x.km = +manual.other + 0.01; });
    }
  }
  list.sort(function (a, b) { return a.km - b.km; });
  return list;
}

    html = '<div class="gne-bar"><span class="gne-stamp">' + h(gneStamp()) + '</span><button type="button" class="btn sm" data-act="gne-refresh">모집정원·현원 새로고침</button></div><div class="row3"><label class="fld"><span>검색</span><input id="gq" placeholder="학교명·지역·유형"></label></div><div class="scroll tall"><table class="dt" id="gt"><thead><tr><th>학교</th><th>지역</th><th>유형</th><th>성별</th><th>모집정원</th><th>1학년 현원</th><th>2학년 현원</th><th>3학년 현원</th><th>전화</th></tr></thead><tbody></tbody></table></div><p class="muted">현원 = 학교알리미 공시 재적(학급수). 4월 1일 기준.</p>';
  } else if (which === 'rules') {
    html = Object.keys(RULES).map(function (id) { var r = RULES[id]; return '<div class="rule" id="rule-' + id + '"><b>' + h(r.t) + '</b> <span class="muted">(' + h(r.p) + ')</span><pre>' + h(r.x) + '</pre></div>'; }).join('');
  } else if (which === 'src') {
    html = '<h4>규정 간 확인이 필요한 점</h4><ol class="warn">' +
      '<li><b>위원회 의결 기준 충돌</b>: 규정 제6조③ 「위원 만장일치로 전입에 동의하는 학생」 ↔ 제4조② 「출석 위원 5분의 3 이상 찬성」. 또한 지침 Ⅲ-6-나-3)은 법령·지침에 없는 학교 자체 결격사유로 불허할 수 없다고 정함 → 규정 정비 검토 필요.</li>' +
      '<li><b>귀국학생 정원</b>: 학칙 제22조③ 1호(특례 귀국자 정원 외 5%)·2호(일반귀국자 정원 내) ↔ 지침 Ⅱ-3(귀국학생 등 정원 외 3%). 앱은 지침(3%) 기준으로 판정하고 「심의」로 표시.</li>' +
      '<li><b>거리 기준(규정 제6조②)</b>: 「현저히 가까운」의 수치 기준이 없음. 앱은 웅천고가 가장 가깝고 다음 학교와 1km 이상 차이면 충족, 아니면 심의로 표시(직선거리 참고값).</li>' +
      '<li><b>정원 외 「제한 없음」 유형</b>: 지침 Ⅱ-3에서 유급·재입학, 학폭 가해, 교육활동 침해, 체육특기자는 「제한 없음」. 앱은 이 유형을 10% 총합 계산에서 뺌(해석 사항).</li>' +
      '<li><b>2027학년도</b>: 2027 지침이 나오면(보통 2월) 비율·시기 변경 여부 확인. 2027 학사일정이 없어 2027.3.1. 이후 날짜는 남은 수업일수를 직접 입력해야 함.</li></ol>' +
      '<h4>자료 출처</h4><table class="dt"><tbody>' + META.sources.map(function (s) { return '<tr><td>' + h(s[0]) + '</td><td>' + h(s[1]) + '</td></tr>'; }).join('') + '</tbody></table>';
  }
  el.innerHTML = html;
  if (which === 'quota') {
    function qsum() {
      $('#qSum').innerHTML = '<table class="dt"><thead><tr><th>학년</th><th>정원 내 결원</th><th>정원 외 총합(10%)</th><th>일반 전입(5%)</th><th>3% 유형 남은 자리</th></tr></thead><tbody>' + [1, 2, 3].map(function (g) {
        var q = Q.g[g], t = 0; OUT_CATS.forEach(function (c) { if (c.in10) t += +q.out[c.k] || 0; });
        var c10 = Math.floor(q.ent * 0.1), c5 = Math.floor(q.ent * 0.05), c3 = Math.floor(q.ent * 0.03);
        return '<tr><td>' + g + '학년</td><td class="c">' + (q.ent - q.inside) + '</td><td class="c">' + t + ' / ' + c10 + '</td><td class="c">' + (+q.out.general || 0) + ' / ' + c5 + '</td><td>' + ['env', 'returnee', 'merit', 'military'].map(function (k) { return lbl(OUT_CATS.map(function (c) { return [c.k, c.n.split('(')[0]]; }), k) + ' ' + Math.max(0, c3 - (+q.out[k] || 0)); }).join(', ') + '</td></tr>';
      }).join('') + '</tbody></table>';
    }
    qsum();
    el.oninput = function (e) {

      var p = t.getAttribute('data-q'); if (!p) return;
      var a = p.split('.'), g = a[0]; if (a[1] === 'out') Q.g[g].out[a[2]] = +t.value || 0; else Q.g[g][a[1]] = +t.value || 0;
      saveBase(); qsum(); rerun();
    };
    $('#qReset').onclick = function () { if (confirm('정원·현원을 공시 기준 기본값으로 되돌릴까요?')) { Q = JSON.parse(JSON.stringify(QUOTA_DEFAULT)); saveBase(); renderData('quota'); rerun(); } };
  }
  if (which === 'cal') {
    el.onchange = function (e) {
      var t = e.target, c = t.getAttribute('data-c'); if (!c) return;
      if (c === 'periods') CAL.periods = t.value.split(/\n+/).map(function (l) { var m = l.match(/(\d{4}-\d{2}-\d{2})\s*~\s*(\d{4}-\d{2}-\d{2})/); return m ? [m[1], m[2]] : null; }).filter(Boolean);
      else if (c === 'holidays') CAL.holidays = (t.value.match(/\d{4}-\d{2}-\d{2}/g) || []);
      else CAL[c] = t.value;
      saveBase(); rerun(); renderData('cal');
    };
    $('#cReset').onclick = function () { if (confirm('학사일정을 공시 기준으로 되돌릴까요?')) { CAL = JSON.parse(JSON.stringify(CAL_DEFAULT)); saveBase(); renderData('cal'); rerun(); } };
  }  if (which === 'gne') {
    var fill = function () {
      var q = ($('#gq').value || '').trim();
      $('#gt tbody').innerHTML = GNE.filter(function (s) { return !q || (s.n + s.r + s.t).indexOf(q) >= 0; }).map(function (s) { var si = s.si || {}; var gc = function (i) { return si.cnt ? si.cnt[i] + '명(' + si.cls[i] + ')' : '-'; }; return '<tr><td>' + h(s.n) + '</td><td>' + h(s.r) + '</td><td>' + h(s.t) + '</td><td>' + h(s.g) + '</td><td class="c">' + (s.q || '') + '</td><td class="c">' + gc(0) + '</td><td class="c">' + gc(1) + '</td><td class="c">' + gc(2) + '</td><td>' + h(s.tel) + '</td></tr>'; }).join('');
    };
    fill(); $('#gq').oninput = fill;
  }
}

/* ---------- 모집정원 최신화(고입포털) ---------- */
var GNE_LS = 'wc-transfer-gne-v1';
function applyGne(list, meta) {
  if (!list || list.length < 100) return false;
  GNE = list; GNE_META = meta;
  JINHAE.forEach(function (j) { var s = GNE.filter(function (x) { return x.n === j.n; })[0]; if (s && s.q) j.q = s.q; });
  return true;
}
function loadGneCache() { try { var c = JSON.parse(localStorage.getItem(GNE_LS) || 'null'); if (c && c.schools && c.siYear && String(c.updated) > String(GNE_META.updated)) applyGne(c.schools, { updated: c.updated, from: '저장된 값', siYear: c.siYear }); } catch (e) { } }
function gneStamp() { return '모집정원·현원 기준: ' + GNE_META.updated + ' 수집 · 모집정원 고입포털, 현원 ' + (GNE_META.siYear ? '학교알리미 ' + GNE_META.siYear + ' 공시(4월 1일 기준)' : '자료 없음') + ' · ' + GNE_META.from; }
function paintGneStamp(msg, cls) { $$('.gne-stamp').forEach(function (el) { el.textContent = msg || gneStamp(); el.className = 'gne-stamp ' + (cls || ''); }); }
var GNE_BUSY = false;
function refreshGne(force) {
  if (GNE_BUSY) return; GNE_BUSY = true;
  paintGneStamp(force ? '고입포털·학교알리미에서 새로 읽는 중…(1분 정도 걸림)' : '모집정원·현원 최신 자료 확인 중…', 'busy');
  fetch(GNE_PROXY + (force ? '?force=1' : '')).then(function (r) { return r.json(); }).then(function (j) {
    GNE_BUSY = false;
    if (!j.ok || !applyGne(j.schools, { updated: j.updated, from: '최신', siYear: j.siYear })) throw new Error(j.error || '자료 없음');
    try { localStorage.setItem(GNE_LS, JSON.stringify({ updated: j.updated, siYear: j.siYear, schools: j.schools })); } catch (e) { }
    paintGneStamp(gneStamp() + ' (' + j.count + '교)', 'ok');
    rerun(); var on = $('.sub.on'); if (on && ['gne', 'jinhae'].indexOf(on.getAttribute('data-sub')) >= 0) renderData(on.getAttribute('data-sub'));
  }).catch(function (e) { GNE_BUSY = false; paintGneStamp(gneStamp() + ' · 새로고침 실패(인터넷 연결 확인): ' + e.message, 'warn'); });
}

/* ---------- 주소 → 좌표 → 거리 ---------- */
var GEO_MAP = null, GEO_HOME = null;
function geoMsg(t, cls) { var m = $('#fIn .geo-msg'); if (m) { m.textContent = t; m.className = 'geo-msg ' + (cls || 'muted'); } }
function photon(q, box) {
  var u = 'https://photon.komoot.io/api/?limit=6&lang=default&q=' + encodeURIComponent(q) + (box ? '&bbox=128.60,35.04,128.87,35.21' : '&lat=35.13&lon=128.72');
  return fetch(u).then(function (r) { return r.json(); }).then(function (j) {
    return (j.features || []).filter(function (f) { return f.properties.countrycode === 'KR'; }).map(function (f) {
      var p = f.properties, lab = [p.city, p.district, p.street, p.housenumber, p.name && p.name !== p.street ? p.name : ''].filter(Boolean).join(' ');
      return { lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0], label: lab || q };
    });
  });
}
function roadDist(lat, lng) {
  var pts = [[lng, lat]].concat(JINHAE.map(function (s) { return [s.lng, s.lat]; }));
  var u = 'https://router.project-osrm.org/table/v1/driving/' + pts.map(function (p) { return p[0].toFixed(6) + ',' + p[1].toFixed(6); }).join(';') + '?sources=0&annotations=distance';
  return fetch(u).then(function (r) { return r.json(); }).then(function (j) {
    if (j.code !== 'Ok') throw new Error(j.code);
    var m = {}; JINHAE.forEach(function (s, i) { var d = j.distances[0][i + 1]; if (d != null) m[s.n] = { km: d / 1000 }; }); return m;
  });
}
function setGeo(c, note) {
  var g = { lat: c.lat, lng: c.lng, label: c.label, road: null };
  STATE.in.geo = g; run('in');
  geoMsg('위치: ' + c.label + (note ? ' ' + note : '') + ' · 도로거리 계산 중…');
  showMap(c);
  roadDist(c.lat, c.lng).then(function (m) {
    if (STATE.in.geo !== g) return;
    g.road = m; run('in'); geoMsg('위치: ' + c.label + (note ? ' ' + note : '') + ' · 도로거리(자동차 경로) 반영. 위치가 다르면 지도의 핀을 끌어 옮기세요.', 'ok-msg');
  }).catch(function () { if (STATE.in.geo === g) geoMsg('위치: ' + c.label + ' · 도로거리 서버 응답이 없어 직선거리로 판정합니다.', 'warn-msg'); });
}
function showMap(c) {
  var el = $('#geoMap'); if (!el || typeof L === 'undefined') return;
  el.hidden = false;
  if (!GEO_MAP) {
    GEO_MAP = L.map(el, { scrollWheelZoom: false }).setView([c.lat, c.lng], 12);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Tiles © Esri' }).addTo(GEO_MAP);
    JINHAE.forEach(function (s) { L.circleMarker([s.lat, s.lng], { radius: s.me ? 8 : 6, color: s.me ? '#0b2a5b' : '#475569', fillColor: s.me ? '#f59e0b' : '#94a3b8', fillOpacity: 1, weight: 2 }).addTo(GEO_MAP).bindTooltip(s.s + (s.from ? '(2027 개교)' : ''), { permanent: true, direction: 'top', offset: [0, -6], className: 'sch-tip' }); });
    GEO_HOME = L.marker([c.lat, c.lng], { draggable: true, title: '거주지(끌어서 조정)' }).addTo(GEO_MAP);
    GEO_HOME.on('dragend', function () { var p = GEO_HOME.getLatLng(); setGeo({ lat: p.lat, lng: p.lng, label: ($('#fIn [name=addr]').value || '지도 위치') }, '(지도에서 조정)'); });
  } else { GEO_HOME.setLatLng([c.lat, c.lng]); }
  setTimeout(function () { GEO_MAP.invalidateSize(); var b = L.latLngBounds([[c.lat, c.lng], [35.11269, 128.74919]]); GEO_MAP.fitBounds(b.pad(0.35), { maxZoom: 15 }); }, 50);
}
function geocodeAddr() {
  var q = ($('#fIn [name=addr]').value || '').trim(), ul = $('#fIn .geo-cands'); ul.innerHTML = '';
  if (!q) { STATE.in.geo = null; run('in'); geoMsg(''); return; }
  geoMsg('주소를 찾는 중…');
  photon(q, true).then(function (a) { return a.length ? a : photon(q.indexOf('진해') < 0 ? '창원시 진해구 ' + q : q, false); }).then(function (a) {
    if (!a.length) { geoMsg('주소를 찾지 못했습니다. 도로명만(예: 웅천중로) 넣어 보거나 행정동을 고르세요.', 'warn-msg'); return; }
    if (a.length > 1) ul.innerHTML = a.slice(0, 5).map(function (c, i) { return '<li><button type="button" data-geo="' + i + '"' + (i === 0 ? ' class="on"' : '') + '>' + h(c.label) + '</button></li>'; }).join('');
    ul._cands = a; setGeo(a[0]);
  }).catch(function () { geoMsg('주소 검색 서버에 연결할 수 없습니다(인터넷 연결 확인). 행정동을 고르거나 거리를 직접 입력하세요.', 'warn-msg'); });
}

/* ---------- 실행 ---------- */
var STATE = { in: { ex: {}, open: {} }, out: { ex: {}, open: {} } };
function run(kind) {
  var isIn = kind === 'in', form = $(isIn ? '#fIn' : '#fOut'), fields = isIn ? FIELDS_IN : FIELDS_OUT;
  var f = readForm(form, fields);
  var ex = (STATE[kind] && STATE[kind].ex) || {};
  if (isIn) f.geo = (STATE.in.geo && f.addr) ? STATE.in.geo : null;
  CUR_EX = ex;
  var res = isIn ? evalIn(f, Q, CAL) : evalOut(f, Q, CAL);
  var old = STATE[kind] || {};
  STATE[kind] = { f: f, res: res, ex: ex, open: old.open || {}, pick: old.pick || {}, geo: old.geo || null };
  $(isIn ? '#sIn' : '#sOut').innerHTML = renderSheet(kind, f, res);
  var hint = form.querySelector('[data-k="remOverride"] span');
  if (hint) { var rem = f.date ? remainingDays(CAL, f.date) : null; hint.textContent = (isIn ? '웅천고' : '전입교') + ' 남은 수업일수(자동 ' + (rem == null ? '계산 불가' : rem + '일') + ', 직접 입력 시 우선)'; }
}
function rerun() { run('in'); run('out'); }
function showTab(id) {
  $$('.tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === id); b.setAttribute('aria-selected', b.getAttribute('data-tab') === id); });
  $$('.pane').forEach(function (p) { p.hidden = p.id !== 'tab-' + id; });
  document.body.setAttribute('data-tab', id);
}
function openRule(id) {
  var r = RULES[id]; if (!r) return;
  $('#dlgT').textContent = r.t + ' (' + r.p + ')'; $('#dlgX').textContent = r.x; $('#dlg').showModal();
}
document.addEventListener('DOMContentLoaded', function () {
  loadBase();
  loadGneCache();
  buildForm($('#fIn'), FIELDS_IN, function () { run('in'); });
  buildForm($('#fOut'), FIELDS_OUT, function () { run('out'); });
  rerun();
  $$('.tab').forEach(function (b) { b.onclick = function () { showTab(b.getAttribute('data-tab')); }; });
  $$('.sub').forEach(function (b) { b.onclick = function () { $$('.sub').forEach(function (x) { x.classList.toggle('on', x === b); }); renderData(b.getAttribute('data-sub')); }; });
  renderData('quota');
  document.addEventListener('click', function (e) {
    var exi = e.target.closest('input[data-ex]');
    if (exi) { var kd = exi.closest('#sIn') ? 'in' : 'out'; var id = exi.getAttribute('data-ex'); if (exi.checked) STATE[kd].ex[id] = true; else delete STATE[kd].ex[id]; run(kd); return; }
    var g = e.target.closest('[data-goto]');
    if (g) { var sh = g.closest('.sheet'), kd2 = sh.id === 'sIn' ? 'in' : 'out', d = sh.querySelector('details[data-rid="' + g.getAttribute('data-goto') + '"]'); if (d) { d.open = true; STATE[kd2].open[d.getAttribute('data-rid')] = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); d.classList.add('flash'); setTimeout(function () { d.classList.remove('flash'); }, 1600); } return; }
    var ps = e.target.closest('input.rd-sel');
    if (ps) { var kd3 = ps.closest('#sIn') ? 'in' : 'out'; STATE[kd3].pick[ps.getAttribute('data-rid')] = ps.checked; run(kd3); return; }
    var t = e.target.closest('[data-rule]'); if (t) { openRule(t.getAttribute('data-rule')); return; }
    var gc = e.target.closest('[data-geo]');
    if (gc) { var ul = gc.closest('.geo-cands'); $$('button', ul).forEach(function (b) { b.classList.toggle('on', b === gc); }); setGeo(ul._cands[+gc.getAttribute('data-geo')]); return; }
    var a = e.target.closest('[data-act]'); if (!a) return;
    var act = a.getAttribute('data-act');
    if (act === 'geo') geocodeAddr();
    if (act === 'gne-refresh') refreshGne(true);
    if (act === 'print') window.print();
    if (act === 'pick-key' || act === 'pick-all' || act === 'pick-none') { var kd5 = a.closest('#sIn') ? 'in' : 'out'; STATE[kd5].pick = {}; if (act !== 'pick-key') citedRules(STATE[kd5].res).forEach(function (c) { STATE[kd5].pick[c.id] = act === 'pick-all'; }); run(kd5); }
    if (act === 'open-all' || act === 'close-all') { var sh2 = a.closest('.sheet'), kd4 = sh2.id === 'sIn' ? 'in' : 'out'; $$('details.rd', sh2).forEach(function (d) { d.open = act === 'open-all'; STATE[kd4].open[d.getAttribute('data-rid')] = d.open; }); }
    if (act === 'hwpx-in') exportHwpx('in'); if (act === 'hwpx-out') exportHwpx('out');
    if (act === 'xlsx-in') exportResultXlsx('in'); if (act === 'xlsx-out') exportResultXlsx('out');
    if (act === 'xlsx-base') exportBaseXlsx();
    if (act === 'reset-in') { $('#fIn').reset(); STATE.in.ex = {}; STATE.in.geo = null; var gm = $('#geoMap'); if (gm) gm.hidden = true; $('#fIn .geo-cands').innerHTML = ''; geoMsg(''); run('in'); } if (act === 'reset-out') { $('#fOut').reset(); STATE.out.ex = {}; run('out'); }
  });
  $('#dlgClose').onclick = function () { $('#dlg').close(); };
  $('#fIn').addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.name === 'addr') { e.preventDefault(); geocodeAddr(); } });
  $('#fIn').addEventListener('input', function (e) { if (e.target.name === 'addr' && !e.target.value.trim()) { STATE.in.geo = null; var m = $('#geoMap'); if (m) m.hidden = true; $('#fIn .geo-cands').innerHTML = ''; geoMsg(''); run('in'); } });
  document.addEventListener('toggle', function (e) { var d = e.target; if (!d.matches || !d.matches('details.rd')) return; var kd = d.closest('#sIn') ? 'in' : 'out'; STATE[kd].open[d.getAttribute('data-rid')] = d.open; }, true);
  var printOpened = [];
  window.addEventListener('beforeprint', function () { printOpened = $$('details.rd:not([open])'); printOpened.forEach(function (d) { d.setAttribute('open', ''); }); });
  window.addEventListener('afterprint', function () { printOpened.forEach(function (d) { d.removeAttribute('open'); }); printOpened = []; });
  showTab('in');
  refreshGne(false);
});

</script>
